services:
    laravel:
        container_name: "${LARAVEL_CONTAINER_NAME:-laravel}"
        build:
            context: './docker/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.my-media-library.rule=Host(`my-media-library.docker.lan`)"
            - "traefik.http.routers.my-media-library.entrypoints=web"
            - "traefik.http.services.my-media-library.loadbalancer.server.port=80"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - './laravel:/var/www/html'
        networks:
            - docker_lan_network
        depends_on:
            - mysql
            - redis

    mysql:
        image: 'mysql/mysql-server:8.0'
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - docker_lan_network
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${MYSQL_PASSWORD}"
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        volumes:
            - 'sail-redis:/data'
        networks:
            - docker_lan_network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    docker_lan_network:
        external: true

volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
